name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show current versions
        run: |
          echo "Current workspace versions:"
          pnpm -r exec pnpm pkg get name version

      - name: Bump workspace package versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for package_json in packages/*/package.json; do
            package_dir=$(dirname "$package_json")

            echo "Bumping $package_dir"

            npm version patch \
              --no-git-tag-version \
              --prefix "$package_dir"
          done

      - name: Show new versions
        run: |
          echo "New workspace versions:"
          pnpm -r exec pnpm pkg get name version

      - name: Commit version bump
        run: |
          git add packages/*/package.json

          git commit \
            -m "chore: bump all package versions [skip ci]" \
            || echo "No changes to commit"

          git push origin HEAD:main

      - name: Build packages
        run: pnpm --filter "./packages/**" run build

      - name: Verify publish tarballs include dist
        run: |
          for pkg in packages/*/; do
            name=$(node -p "require('./${pkg}package.json').name")
            private=$(node -p "Boolean(require('./${pkg}package.json').private)")
            if [ "$private" = "true" ]; then
              echo "Skipping private package $name"
              continue
            fi
            echo "Checking $name"
            (cd "$pkg" && npm pack --dry-run) | tee /tmp/pack-list.txt
            if ! grep -F 'dist/index.js' /tmp/pack-list.txt >/dev/null || ! grep -F 'dist/index.d.ts' /tmp/pack-list.txt >/dev/null; then
              echo "::error::$name tarball is missing dist/index.js or dist/index.d.ts"
              exit 1
            fi
          done

      - name: Check npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        run: pnpm publish -r --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
